name: "fir-boundaries"

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.FIR_BOUNDARIES_TOKEN || github.token }}
      - name: "Setup Node.js"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.x"
      - name: "Regenerate FIR boundaries from VATSpy"
        id: generate
        run: bash .github/scripts/generate_fir_boundaries.sh
      - name: "Open a pull request when the data changed"
        env:
          GH_TOKEN: ${{ secrets.FIR_BOUNDARIES_TOKEN || github.token }}
          VATSPY_COMMIT: ${{ steps.generate.outputs.vatspy_commit }}
        run: bash .github/scripts/open_fir_boundaries_pr.sh
