name: "fir-boundaries"

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FIR_BOUNDARIES_TOKEN || github.token }}
      - name: "Setup Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"
      - name: "Regenerate FIR boundaries from VATSpy"
        id: generate
        run: bash .github/scripts/generate_fir_boundaries.sh
      - name: "Open a pull request when the data changed"
        env:
          GH_TOKEN: ${{ secrets.FIR_BOUNDARIES_TOKEN || github.token }}
          VATSPY_COMMIT: ${{ steps.generate.outputs.vatspy_commit }}
        run: bash .github/scripts/open_fir_boundaries_pr.sh
