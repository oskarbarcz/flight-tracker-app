name: "release"

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: "ubuntu-latest"
    environment: build
    steps:
      - name: "Checkout"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0
      - name: "Setup Node"
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020" # v4.4.0
        with:
          node-version: "26.x"
      - name: "Install dependencies"
        run: npm ci
      - name: "Build"
        run: npm run build
        env:
          VITE_NODE_ENV: ${{ vars.VITE_NODE_ENV }}
          VITE_FLIGHT_TRACKER_API_HOST: ${{ vars.VITE_FLIGHT_TRACKER_API_HOST }}
          VITE_ADSB_API_HOST: ${{ vars.VITE_ADSB_API_HOST }}
          VITE_DISCORD_INVITATION_HASH: ${{ vars.VITE_DISCORD_INVITATION_HASH }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_CARTO_API_KEY: ${{ vars.VITE_CARTO_API_KEY }}
      - name: "Upload artifact"
        uses: "actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa" # v3.0.1
        with:
          path: ./build/client

  release:
    runs-on: "ubuntu-24.04"
    environment: tag
    steps:
      - name: "Checkout"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0
      - name: "Release and push git tag"
        run: git tag $(jq -r '.version' package.json) && git push --tags
      - name: "Create a GitHub release"
        run: gh release create $(jq -r '.version' package.json) --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    needs: "build"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e" # v4.0.5
