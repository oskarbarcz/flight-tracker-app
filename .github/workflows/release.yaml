name: "release"

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: "ubuntu-latest"
    environment: build
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Setup Node"
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "26.x"
      - name: "Install dependencies"
        run: npm ci
      - name: "Build"
        run: npm run build
        env:
          VITE_NODE_ENV: ${{ vars.VITE_NODE_ENV }}
          VITE_FLIGHT_TRACKER_API_HOST: ${{ vars.VITE_FLIGHT_TRACKER_API_HOST }}
          VITE_ADSB_API_HOST: ${{ vars.VITE_ADSB_API_HOST }}
          VITE_DISCORD_INVITATION_HASH: ${{ vars.VITE_DISCORD_INVITATION_HASH }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_CARTO_API_KEY: ${{ vars.VITE_CARTO_API_KEY }}
      - name: "Upload artifact"
        uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
        with:
          path: ./build/client

  release:
    runs-on: "ubuntu-24.04"
    environment: tag
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Release and push git tag"
        run: git tag $(jq -r '.version' package.json) && git push --tags
      - name: "Create a GitHub release"
        run: gh release create $(jq -r '.version' package.json) --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    needs: "build"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1
