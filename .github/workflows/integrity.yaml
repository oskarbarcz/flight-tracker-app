name: "integrity"

on:
  pull_request:
    paths: [ "**", "!**.md" ]

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
      - name: "Check for CRLF line endings"
        uses: gi-org-pl/check-crlf-action@464995c09f1659cd4b0f7e2bf7234994f0fd705e # v1.0.2
      - name: "Check for file permission changes"
        uses: gi-org-pl/check-file-permissions-action@1cec1b07fa817da3da98bd2da20992365d6b4da6 # v1.0.0
      - name: "Check app version is unique"
        uses: gi-org-pl/check-version-action@c884d1e92d3eef7b26d6277d49f18d0803009d73 # v1.0.0
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"
      - name: "Install dependencies"
        run: npm ci
      - name: "Check code with linter and formatter"
        run: npm run lint
      - name: "Check TypeScript types"
        run: npm run typecheck
      - name: "Build app"
        run: npm run build
        env:
          VITE_NODE_ENV: ${{ vars.VITE_NODE_ENV }}
          VITE_FLIGHT_TRACKER_API_HOST: ${{ vars.VITE_FLIGHT_TRACKER_API_HOST }}
          VITE_ADSB_API_HOST: ${{ vars.VITE_ADSB_API_HOST }}
          VITE_DISCORD_INVITATION_HASH: ${{ vars.VITE_DISCORD_INVITATION_HASH }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_CARTO_API_KEY: ${{ vars.VITE_CARTO_API_KEY }}
      - name: "Build Storybook"
        run: npm run build-storybook
      - name: "Install Playwright Chromium"
        run: npx playwright install --with-deps chromium
      - name: "Test stories"
        run: npm run test:storybook
