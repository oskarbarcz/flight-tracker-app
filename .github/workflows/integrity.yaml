name: "integrity"

on:
  pull_request:
    paths: [ "**", "!**.md" ]

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: "Check for CRLF line endings"
        uses: gi-org-pl/check-crlf-action@v1
      - name: "Check for file permission changes"
        uses: gi-org-pl/check-file-permissions-action@v1
      - name: "Check app version is unique"
        uses: gi-org-pl/check-version-action@v1
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
      - name: "Install dependencies"
        run: npm ci
      - name: "Check code with linter and formatter"
        run: npm run lint
      - name: "Check TypeScript types"
        run: npm run typecheck
      - name: "Build app"
        run: npm run build
        env:
          VITE_NODE_ENV: ${{ vars.VITE_NODE_ENV }}
          VITE_FLIGHT_TRACKER_API_HOST: ${{ vars.VITE_FLIGHT_TRACKER_API_HOST }}
          VITE_ADSB_API_HOST: ${{ vars.VITE_ADSB_API_HOST }}
          VITE_DISCORD_INVITATION_HASH: ${{ vars.VITE_DISCORD_INVITATION_HASH }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
